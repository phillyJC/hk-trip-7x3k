    --accent:#5BC0E0; --accent-ink:#06202C; --lodge:#F0A64A; --lodge-bg:#33260F;
    --ok:#6CCB92; --ok-bg:#12301F; --warn:#FF9A88; --warn-bg:#3A1812; --chip:#223250; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1624; --card:#16233A; --ink:#E7EDF6; --sub:#9FB0C7; --line:#2A3A55;
  --accent:#5BC0E0; --accent-ink:#06202C; --lodge:#F0A64A; --lodge-bg:#33260F;
  --ok:#6CCB92; --ok-bg:#12301F; --warn:#FF9A88; --warn-bg:#3A1812; --chip:#223250; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 84px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
header .hrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
header .hl{min-width:0;flex:1}
header .hr{flex:0 0 auto;text-align:right;line-height:1.25;font-variant-numeric:tabular-nums}
.hdate{font-size:12px;color:var(--sub);white-space:nowrap}
.htime{font-size:20px;font-weight:700;white-space:nowrap;letter-spacing:.2px}
.htime small{font-size:11px;font-weight:500;color:var(--sub);margin-left:3px}
button.hwx{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center;font-size:13px;color:var(--ink);margin-top:2px;padding:1px 4px;border-radius:8px}
button.hwx:focus-visible{outline:3px solid var(--lodge);outline-offset:2px}
button.hwx .wi{font-size:20px;line-height:1}
h1{font-size:19px;margin:0;line-height:1.3}
.hd-sub{font-size:13px;color:var(--sub);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
main{padding-top:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0}
p{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.note{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn)}
.note.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.small{font-size:13px;color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;font-size:14px;text-align:center;min-width:58px;cursor:pointer}
.chip b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.chip span{display:block;font-size:11px;color:var(--sub)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on span{color:var(--accent-ink);opacity:.85}
.chip.today{outline:2px solid var(--lodge);outline-offset:1px}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;background:var(--chip);color:var(--ink);white-space:nowrap}
.tag.free{background:var(--ok-bg);color:var(--ok);font-weight:500}

.tag.bad{background:var(--warn-bg);color:var(--warn);font-weight:500}

.lodge .k{font-size:12px;color:var(--lodge);font-weight:700;letter-spacing:.06em}
.lodge .v{font-size:17px;font-weight:700}
.btn{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:9px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
a{color:var(--accent)}
.links{display:flex;flex-wrap:wrap;gap:6px 16px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fact{background:var(--chip);border-radius:10px;padding:8px 10px;min-width:0}
.fact .k{font-size:11px;color:var(--sub)}
.fact .v{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.tl li:first-child{border-top:0}
.tl .t{font-size:13px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.tl .t.none{color:var(--sub);font-weight:400}
.tl .x{min-width:0;overflow-wrap:anywhere}
.tl li.warn .x{color:var(--warn)}
.ov{display:flex;flex-direction:column}
.ov button{all:unset;display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.ov button:first-child{border-top:0}
.ov .d{font-weight:700;font-variant-numeric:tabular-nums}
.ov .d span{display:block;font-size:11px;color:var(--sub);font-weight:400}
.ov .r{font-size:14px}
.ov .stay{display:inline-block;margin-top:4px;border:2px solid var(--lodge);background:var(--lodge-bg);border-radius:7px;padding:0 8px;font-size:13px;font-weight:700}
.kv{display:grid;grid-template-columns:78px 1fr;gap:4px 10px;font-size:14px;margin-top:8px}
.kv .k{color:var(--sub)}
.kv div{min-width:0;overflow-wrap:anywhere}
.hot{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hot h3{overflow-wrap:anywhere}
.jp{font-size:12px;color:var(--sub);font-weight:400;display:block}
.pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--sub);font-weight:500}
.check{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;accent-color:var(--accent);margin:2px 0 0}
.check label{min-width:0;overflow-wrap:anywhere}
.check input:checked+label{color:var(--sub);text-decoration:line-through}
.check.nostrike input:checked+label{color:var(--ink);text-decoration:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(9,1fr);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav button{all:unset;text-align:center;font-size:11.5px;font-weight:500;color:var(--sub);padding:10px 0;border-radius:8px;cursor:pointer;line-height:1.3}
nav button.on{color:var(--accent);background:var(--chip)}
button.lnk{all:unset;cursor:pointer;text-align:left;font-size:15px}
.inp{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.sosb{display:grid;grid-template-columns:1fr auto;grid-template-areas:'n c' 'l l';gap:4px 10px;align-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.sosb .sn{grid-area:n;font-size:22px;font-weight:700;color:var(--warn);min-width:0}
.sosb .sl{grid-area:l}
.sosb .sc{grid-area:c;background:var(--warn);color:#fff;border-radius:8px;padding:8px 14px;font-weight:700}
.sosb.big{padding:14px 12px;border-color:var(--warn)}.sosb.big .sn{font-size:36px}
nav button[data-tab=sos]{color:var(--warn);font-weight:700}
nav button[data-tab=sos].on{background:var(--warn);color:#fff}
.inp{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--lodge);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){main>*{animation:rise .25s ease both}}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

function countdown(){

async function loadFx(force){
  if(sget("hk26-rate-manual")==="1" && !force) return;
  const lv = jget("hk26-rate-live", null);
  if(!force && lv && Date.now()-lv.t < 6*3600e3) return;
  if(!force && fx.fail && Date.now()-fx.fail < 60000) return;
  if(fx.busy) return; fx.busy = true; fx.err = ""; if(st.tab==="cost") render(true);
  try{
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch("https://open.er-api.com/v6/latest/TWD", {signal:ctl.signal}); clearTimeout(to); if(!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json(); if(!d.rates || !(d.rates.JPY>0) || !(d.rates.USD>0)) throw new Error("格式不符");
    sset("hk26-rate-live", JSON.stringify({JPY:1/d.rates.JPY, USD:1/d.rates.USD, t:Date.now(), src:(d.time_last_update_unix||0)*1000})); sset("hk26-rate-manual","0"); fx.fail = 0;
  }catch(e){ fx.fail = Date.now(); fx.err = "無法取得即時匯率（" + (e && e.message ? e.message : "連線失敗") + "），目前使用" + (jget("hk26-rate-live",null) ? "上次的" : "預設") + "匯率。"; }
  fx.busy = false; if(st.tab==="cost") render(true);
}

function outfitCard(d){
  const L = outfitFor(d, OUT.day), D = d.daily, labs = ["今天","明天","後天"];
  let h = '<div class="card"><div class="hot"><h2>穿搭示範</h2><span class="tag">依 ' + Math.round(L.T) + '℃ 體感推算</span></div>';
  h += '<div class="chips" style="margin:6px 0">' + labs.map((x,i) => '<button class="chip' + (OUT.day===i?' on':'') + '" data-oday="' + i + '" style="min-width:64px"><b>' + x + '</b></button>').join("") + '</div>';
  h += outfitSvg(L);
  h += '<div class="kv" style="grid-template-columns:56px 1fr;margin-top:10px">';
  L.tips.forEach(t => { h += '<div class="k">' + t[0] + '</div><div>' + esc(t[1]) + '</div>'; });
  h += '</div><p class="small" style="margin-top:6px">這張圖是依即時預報自動組裝的示意動畫，不是 AI 生成的照片。穿著依個人怕冷程度調整，洋蔥式穿法比較好增減。</p></div>';
  return h;
}

function viewTalk(){
  const cur = TALK.find(x => x.id===sget("hk26-talk")) || TALK[0];
  const FILL = (sget("hk26-fill") || "").trim(), ft = t => FILL ? t.replace(/[〇○]+/g, FILL) : t;
  let h = '<p class="small" id="saymsg" style="color:var(--warn);margin:0"></p>';
  h += '<div class="note">每句右邊的 🔊 會用手機語音念出來，可以直接播給對方聽。句子裡的「〇〇」換成你要說的地方或數字。念不出來時，把手機給對方看日文就好。</div>';
  h += '<div class="card" style="margin-bottom:8px"><label for="fillin"><b>〇〇 要換成：</b></label><input id="fillin" class="inp" placeholder="例如：トイレ、札幌駅、ガソリンスタンド、3" value="' + esc(FILL) + '" style="width:100%;margin-top:6px"><p class="small" style="margin-top:4px">填好按完成（Enter），句子裡的 〇〇 會換成你填的字，🔊 也會念出來。可填日文店名、地名或數字。</p></div>';
  h += '<div class="chips" style="margin:8px 0">';
  TALK.forEach(g => { h += '<button class="chip' + (g.id===cur.id?' on':'') + '" data-talk="' + g.id + '"><b>' + g.ic + '</b><span>' + g.n + '</span></button>'; });
  h += '</div><div class="card"><h2>' + cur.ic + ' ' + cur.n + '：你可以這樣說</h2>';
  cur.say.forEach(p => { h += '<div style="padding:6px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center"><div><div style="font-size:17px;font-weight:600">' + esc(ft(p[0])) + '</div><div class="small">' + esc(ft(p[1])) + '</div><div class="small">' + esc(p[2]) + '</div></div>' + sayBtn(ft(p[0])) + '</div>'; });
  h += '</div>';
  if(cur.hear && cur.hear.length){ h += '<div class="card"><h2>對方可能會這樣說</h2><p class="small">聽到時可以對照意思，🔊 可以先聽聽看長什麼樣子。</p>';
    cur.hear.forEach(p => { h += '<div style="padding:6px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center"><div><div style="font-size:16px;font-weight:600">' + esc(ft(p[0])) + '</div><div class="small">' + esc(ft(p[1])) + '</div><div class="small">' + esc(p[2]) + '</div></div>' + sayBtn(ft(p[0])) + '</div>'; });
    h += '</div>'; }
  return h + '<p class="small">緊急狀況的句子在「緊急」分頁。</p>';
}
document.addEventListener("change", e => { if(e.target.id==="fillin"){ sset("hk26-fill", e.target.value); render(true); } });
document.addEventListener("click", e => { const b = e.target.closest("[data-talk]"); if(!b) return; sset("hk26-talk", b.dataset.talk); render(true); });


/* ---------- 右上角：日本時間時鐘與天氣縮圖 ---------- */
const CLK = new Intl.DateTimeFormat("zh-TW", {timeZone:"Asia/Tokyo", year:"numeric", month:"numeric", day:"numeric", weekday:"short", hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"});
function tickClock(){
  const o = {}; CLK.formatToParts(new Date()).forEach(p => { o[p.type] = p.value; });
  const d = $("#hdate"), t = $("#htime"); if(!d || !t) return;
  d.textContent = o.year + "/" + o.month + "/" + o.day + "（" + String(o.weekday).replace("週","") + "）";
  t.innerHTML = o.hour + ":" + o.minute + ":" + o.second + "<small>日本</small>";
}
function updateHeaderWx(){
  const b = $("#hwx"); if(!b) return;
  const L = curLoc(), key = L.id==="gps" ? "gps" : L.id, c = live.wx[key] || jget("hk26-wx-" + key, null);
  if(!c){ b.innerHTML = '<span class="wi">🌡️</span><span>' + esc(L.name) + ' —</span>'; return; }
  const C = c.d.current, night = C.is_day===0 && C.weather_code<=1, ic = night ? "🌙" : WX(C.weather_code)[0];
  b.innerHTML = '<span class="wi">' + ic + '</span><span><b>' + Math.round(C.temperature_2m) + '°</b> ' + esc(L.name) + '</span>';
  b.title = WX(C.weather_code)[1] + "，體感 " + Math.round(C.apparent_temperature) + "°";
}
tickClock(); setInterval(tickClock, 1000);
updateHeaderWx(); setTimeout(() => loadWx(false), 300); setInterval(() => { loadWx(false); updateHeaderWx(); }, 600000);

/* ---------- 繪製與事件 ---------- */
const VIEWS = {trip:viewTrip, stay:viewStay, food:viewFood, wx:viewWx, park:viewPark, cost:viewCost, todo:viewTodo, talk:viewTalk, sos:viewSos};
function render(keepScroll){
  if(st.tab!=="sos" && typeof stopSosWatch==="function") stopSosWatch();
  $("#main").innerHTML = VIEWS[st.tab]();
  $("#nav").innerHTML = TABS.map(t => '<button data-tab="' + t[0] + '" class="' + (st.tab===t[0]?'on':'') + '"' + (st.tab===t[0]?' aria-current="page"':'') + '>' + t[1] + '</button>').join("");
  $("#count").textContent = countdown();
  if(!keepScroll) window.scrollTo(0,0);
  const on = document.querySelector(".chips .chip.on"); if(on && on.scrollIntoView) on.scrollIntoView({inline:"center",block:"nearest"});
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tab],[data-day],[data-stop],[data-stay]"); if(!b) return;
  if(b.dataset.tab){ st.tab=b.dataset.tab; sset("hk26-tab",st.tab); }
  else if(b.dataset.day){ st.day=b.dataset.day; sset("hk26-day",st.day); }
  else if(b.dataset.stop){ st.stop=b.dataset.stop; }
  else if(b.dataset.stay){ st.tab="stay"; st.stop=b.dataset.stay; sset("hk26-tab","stay"); }
  render(!!(b.dataset.day||b.dataset.stop));
});
document.addEventListener("change", e => {
  const c = e.target.closest("[data-chk]"); if(!c) return;
  let saved = {}; try { saved = JSON.parse(sget("hk26-checks")||"{}"); } catch(x){}
  saved[c.dataset.chk] = c.checked; sset("hk26-checks", JSON.stringify(saved));
  const n = TODO.filter(t => saved[t[0]]===undefined ? t[2]===1 : !!saved[t[0]]).length; const p = $("#prog"); if(p){ p.textContent = n + " / " + TODO.length; p.className = "tag" + (n===TODO.length?" free":""); }
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-bkcopy],[data-bkrestore]"); if(!b) return;
  const ta = $("#bk"), msg = $("#bkmsg");
  if(b.dataset.bkcopy){
    const c = "HK26:" + JSON.stringify({e:jget("hk26-exp",[]), f:fixedState(), r:jget("hk26-rate",{})}); ta.value = c;
    ta.focus(); ta.select(); try { ta.setSelectionRange(0, c.length); } catch(x){}
    let done = false; try { done = document.execCommand("copy"); } catch(x){}
    if(!done && navigator.clipboard){ navigator.clipboard.writeText(c).then(() => { msg.textContent = "已複製，請貼到備忘錄。"; }, () => { msg.textContent = "文字已選取，請長按選「拷貝」。"; }); return; }
    msg.textContent = done ? "已複製，請貼到備忘錄。" : "文字已選取，請長按選「拷貝」。";
  } else {
    const t = ta.value.trim(); let o;
    try { if(t.indexOf("HK26:")!==0) throw 0; o = JSON.parse(t.slice(5)); if(!Array.isArray(o.e)) throw 0; } catch(x){ msg.textContent = "格式不對，請貼上完整的備份文字。"; return; }
    sset("hk26-exp", JSON.stringify(o.e)); sset("hk26-fixed", JSON.stringify(o.f||{})); sset("hk26-rate", JSON.stringify(o.r||{}));
    costSt.bk = undefined; render(true); const m = $("#bkmsg"); if(m) m.textContent = "已還原 " + o.e.length + " 筆。";
  }
});
function cnow(){ const F = costSt.f; const a = $("#c_amt"), n = $("#c_note"); if(a) F.amt = a.value; if(n) F.note = n.value; }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-cday],[data-ctag],[data-ccur],[data-cadd],[data-ccancel],[data-cedit],[data-cdel],[data-cdel0],[data-cdel2]"); if(!b) return;
  const F = costSt.f; cnow(); costSt.bk = undefined; const d = b.dataset;
  if(d.cday) F.day = d.cday; else if(d.ctag) F.tag = d.ctag; else if(d.ccur) F.cur = d.ccur;
  else if(d.ccancel) costSt.f = {day:F.day,tag:"di",amt:"",cur:"JPY",note:"",edit:null};
  else if(d.cdel){ costSt.ask = d.cdel; }
  else if(d.cdel0){ costSt.ask = null; }
  else if(d.cdel2){ sset("hk26-exp", JSON.stringify(jget("hk26-exp",[]).filter(x => x.id!==d.cdel2))); costSt.ask = null; }
  else if(d.cedit){ const x = jget("hk26-exp",[]).find(y => y.id===d.cedit); if(x){ costSt.f = {day:x.day,tag:x.tag,amt:String(x.amt),cur:x.cur,note:x.note||"",edit:x.id}; } }
  else if(d.cadd){
    const amt = parseFloat(F.amt); if(!(amt>0)){ const a = $("#c_amt"); if(a) a.focus(); return; }
    const R = rates(); const rec = {id:F.edit || ("e"+Date.now()), day:F.day, tag:F.tag, amt:amt, cur:F.cur, note:F.note.trim(), twd:amt*R[F.cur]};
    let L = jget("hk26-exp",[]); if(F.edit){ L = L.map(x => x.id===F.edit ? rec : x); } else L.push(rec);
    sset("hk26-exp", JSON.stringify(L)); costSt.f = {day:F.day,tag:F.tag,amt:"",cur:F.cur,note:"",edit:null};
  }
  render(true);
});
document.addEventListener("input", e => {
  if(e.target.id==="c_amt"){ costSt.f.amt = e.target.value; const R = rates(), p = $("#c_prev"); if(p) p.textContent = costSt.f.cur==="JPY" ? "約 NT$ " + fmt((parseFloat(e.target.value)||0)*R.JPY) + "（1 日圓 = " + R.JPY + " 台幣）" : ""; }
  else if(e.target.id==="c_note") costSt.f.note = e.target.value;
  else if(e.target.id==="bk") costSt.bk = e.target.value;
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset && t.dataset.fpaid){ const fs = fixedState(); fs[t.dataset.fpaid] = Object.assign(fs[t.dataset.fpaid]||{}, {paid:t.checked}); sset("hk26-fixed", JSON.stringify(fs)); render(true); }
  else if(t.id==="r_jpy" || t.id==="r_usd"){ const j = parseFloat($("#r_jpy").value), u = parseFloat($("#r_usd").value); const r = {}; if(j>0) r.JPY = j; if(u>0) r.USD = u; sset("hk26-rate", JSON.stringify(r)); sset("hk26-rate-manual","1"); render(true); }
});
(function init(){
  const t = todayId(); const sd = sget("hk26-day"); const stt = sget("hk26-tab");
  st.day = t || (sd && (sd==="ov" || DAYS.some(d => d.id===sd)) ? sd : "ov");
  if(stt && VIEWS[stt]) st.tab = stt;
  if(t){ st.tab = "trip"; const d = DAYS.find(x => x.id===t); if(d && d.stayId) st.stop = d.stayId; }
  render(true);
})();
</script>
